\"\u003e01\u003c/span\u003eLe personnage\u003c/a\u003e\u003ca href=\"#rotation\"\u003e\u003cspan class=\"num\"\u003e02\u003c/span\u003eRotation PvE\u003c/a\u003e\u003ca href=\"#sorts\"\u003e\u003cspan class=\"num\"\u003e03\u003c/span\u003eGrimoire des sorts\u003c/a\u003e\u003ca href=\"#talents\"\u003e\u003cspan class=\"num\"\u003e04\u003c/span\u003eTalents \u0026 builds\u003c/a\u003e\u003ca href=\"#equipement\"\u003e\u003cspan class=\"num\"\u003e05\u003c/span\u003eÉquipement BiS\u003c/a\u003e\u003ca href=\"#progression\"\u003e\u003cspan class=\"num\"\u003e06\u003c/span\u003eProgression\u003c/a\u003e\u003ca href=\"#conseils\"\u003e\u003cspan class=\"num\"\u003e07\u003c/span\u003eConseils\u003c/a\u003e\u003ca href=\"#sources\"\u003e\u003cspan class=\"num\"\u003e08\u003c/span\u003eSources \u0026 notes\u003c/a\u003e\u003c/nav\u003e\u003cdiv class=\"sidenote\"\u003e\u003cstrong\u003ePATCH 1.60.1 · BÊTA\u003c/strong\u003eRotation validée sur le guide Wowhead niveau 30. Le contenu niveau 60 reste théorique et séparé.\u003cdiv style=\"margin-top:15px\"\u003eDernière vérification : 24 octobre 2026\u003c/div\u003e\u003c/div\u003e\u003c/aside\u003e\u003cmain class=\"main\"\u003e\n\u003csection class=\"hero\" id=\"intro\"\u003e\u003cdiv class=\"hero-inner\"\u003e\u003cspan class=\"tag\"\u003e\u003ci class=\"dot\"\u003e\u003c/i\u003e WORLD OF WARCRAFT · FOREVER\u003c/span\u003e\u003cdiv class=\"eyebrow\" style=\"margin-top:17px\"\u003eLE PRÉDATEUR\u003c/div\u003e\u003ch1\u003eVoleur\u003cbr\u003e\u003cspan\u003eCombat\u003c/span\u003e\u003c/h1\u003e\u003cp\u003eUn guide entièrement consacré au Voleur Combat sur WoW Forever : rotation réellement publiée par Wowhead, icônes des sorts, talents, sélection d’objets et itinéraire de progression.\u003c/p\u003e\u003cdiv class=\"meta\"\u003e\u003cspan class=\"metabox\"\u003e\u003cb\u003e01\u003c/b\u003e · Énergie · Points de combo · Attaques physiques\u003c/span\u003e\u003cspan class=\"metabox\"\u003eBêta \u003cb\u003eNIVEAU 30\u003c/b\u003e\u003c/span\u003e\u003cspan class=\"metabox\"\u003eGUIDE \u003cb\u003eWOWHEAD\u003c/b\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\n\u003cdiv class=\"mobilejump\"\u003e\u003ca href=\"#intro\"\u003eLe personnage\u003c/a\u003e\u003ca href=\"#rotation\"\u003eRotation PvE\u003c/a\u003e\u003ca href=\"#sorts\"\u003eGrimoire des sorts\u003c/a\u003e\u003ca href=\"#talents\"\u003eTalents \u0026 builds\u003c/a\u003e\u003ca href=\"#equipement\"\u003eÉquipement BiS\u003c/a\u003e\u003ca href=\"#progression\"\u003eProgression\u003c/a\u003e\u003ca href=\"#conseils\"\u003eConseils\u003c/a\u003e\u003ca href=\"#sources\"\u003eSources \u0026 notes\u003c/a\u003e\u003c/div\u003e\n\u003cdiv class=\"grid3\"\u003e\u003cdiv class=\"statcard\"\u003e\u003cdiv class=\"minor\"\u003eVERSION CONFIRMÉE\u003c/div\u003e\u003cstrong\u003eNiveau 30\u003c/strong\u003e\u003cp\u003eGuide Wowhead du 6 oct. 2026\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"statcard\"\u003e\u003cdiv class=\"minor\"\u003eBUILD NIVEAU 60\u003c/div\u003e\u003cstrong\u003e18 Assassinat / 33 Combat\u003c/strong\u003e\u003cp\u003eSimulation, pas BiS confirmé\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"statcard\"\u003e\u003cdiv class=\"minor\"\u003eSOURCES UTILISÉES\u003c/div\u003e\u003cstrong\u003eWowhead +\u003c/strong\u003e\u003cp\u003eBlizzard \u0026 BrokenMeta\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"strip\"\u003e\u003cstrong\u003eLe point crucial.\u003c/strong\u003e La main droite lente est déterminante : de bonnes attaques automatiques et Attaque pernicieuse constituent la base du Combat. Débiter doit rester actif. Toutes les icônes et fiches de sorts renvoient vers \u003cb\u003eWoWhead Forever\u003c/b\u003e. Les images sont chargées depuis son CDN : une connexion internet est requise pour les afficher.\u003c/div\u003e\n\u003csection class=\"section\" id=\"rotation\"\u003e\u003cdiv class=\"sthead\"\u003e\u003cdiv\u003e\u003cdiv class=\"sect-kicker\"\u003e01 / OP e\u003c/div\u003e\u003c/header\u003e\n\u003cdiv class=\"frame\"\u003e\u003caside class=\"sidebar\"\u003e\u003cdiv class=\"eyebrow\" style=\"margin:3px 12px 18px\"\u003eGUIDE / CHASSEUR\u003c/div\u003e\u003cnav class=\"sidenav\"\u003e\u003ca href=\"#intro\"\u003e\u003cspan class=\"num\"\u003e01\u003c/span\u003eLe personnage\u003c/a\u003e\u003ca href=\"#rotation\"\u003e\u003cspan class=\"num\"\u003e02\u003c/span\u003eRotation PvE\u003c/a\u003e\u003ca href=\"#sorts\"\u003e\u003cspan class=\"num\"\u003e03\u003c/span\u003eGrimoire des sorts\u003c/a\u003e\u003ca href=\"#talents\"\u003e\u003cspan class=\"num\"\u003e04\u003c/span\u003eTalents \u0026 builds\u003c/a\u003e\u003ca href=\"#equipement\"\u003e\u003cspan class=\"num\"\u003e05\u003c/span\u003eÉquipement BiS\u003c/a\u003e\u003ca href=\"#progression\"\u003e\u003cspan class=\"num\"\u003e06\u003c/span\u003eProgression\u003c/a\u003e\u003ca href=\"#conseils\"\u003e\u003cspan class=\"num\"\u003e07\u003c/span\u003eConseils\u003c/a\u003e\u003ca href=\"#sources\"\u003e\u003cspan class=\"num\"\u003e08\u003c/span\u003eSources \u0026 notes\u003c/a\u003e\u003c/nav\u003e\u003cdiv class=\"sidenote\"\u003e\u003cstrong\u003ePATCH 1.60.1 · BÊTA\u003c/strong\u003eRotation validée sur le guide Wowhead niveau 30. Le contenu niveau 60 reste théorique et séparé.\u003cdiv style=\"margin-top:15px\"\u003eDernière vérification : 24 octobre 2026\u003c/div\u003e\u003c/div\u003e\u003c/aside\u003e\u003cmain class=\"main\"\u003e\n\u003csection class=\"hero\" id=\"intro\"\u003e\u003cdiv class=\"hero-inner\"\u003e\u003cspan class=\"tag\"\u003e\u003ci class=\"dot\"\u003e\u003c/i\u003e WORLD OF WARCRAFT · FOREVER\u003c/span\u003e\u003cdiv class=\"eyebrow\" style=\"margin-top:17px\"\u003eLA MAÎTRESSE DES FAUVES\u003c/div\u003e\u003ch1\u003eChasseur\u003cbr\u003e\u003cspan\u003eMaîtrise des bêtes\u003c/span\u003e\u003c/h1\u003e\u003cp\u003eL’espace Chasseur BM est indépendant : priorités issues du guide Wowhead Forever, vrais sorts de la spécialisation et suivi des objets recherchés.\u003c/p\u003e\u003cdiv class=\"meta\"\u003e\u003cspan class=\"metabox\"\u003e\u003cb\u003e01\u003c/b\u003e · Mana · Tir à distance · Familier · Faucons\u003c/span\u003e\u003cspan class=\"metabox\"\u003eBêta \u003cb\u003eNIVEAU 30\u003c/b\u003e\u003c/span\u003e\u003cspan class=\"metabox\"\u003eGUIDE \u003cb\u003eWOWHEAD\u003c/b\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\n\u003cdiv class=\"mobilejump\"\u003e\u003ca href=\"#intro\"\u003eLe personnage\u003c/a\u003e\u003ca href=\"#rotation\"\u003eRotation PvE\u003c/a\u003e\u003ca href=\"#sorts\"\u003eGrimoire des sorts\u003c/a\u003e\u003ca href=\"#talents\"\u003eTalents \u0026 builds\u003c/a\u003e\u003ca href=\"#equipement\"\u003eÉquipement BiS\u003c/a\u003e\u003ca href=\"#progression\"\u003eProgression\u003c/a\u003e\u003ca href=\"#conseils\"\u003eConseils\u003c/a\u003e\u003ca href=\"#sources\"\u003eSources \u0026 notes\u003c/a\u003e\u003c/div\u003e\n\u003cdiv class=\"grid3\"\u003e\u003cdiv class=\"statcard\"\u003e\u003cdiv class=\"minor\"\u003eVERSION CONFIRMÉE\u003c/div\u003e\u003cstrong\u003eNiveau 30\u003c/strong\u003e\u003cp\u003eGuide Wowhead du 11 oct. 2026\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"statcard\"\u003e\u003cdiv class=\"minor\"\u003eBUILD NIVEAU 60\u003c/div\u003e\u003cstrong\u003e33 Maîtrise des bêtes / 18 Précision\u003c/strong\u003e\u003cp\u003eSimulation, pas BiS confirmé\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"statcard\"\u003e\u003cdiv class=\"minor\"\u003eSOURCES UTILISÉES\u003c/div\u003e\u003cstrong\u003eWowhead +\u003c/strong\u003e\u003cp\u003eBlizzard \u0026 BrokenMeta\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"strip\"\u003e\u003cstrong\u003eLe point crucial.\u003c/strong\u003e Le familier est au centre de ton jeu. Sur Forever, Invocation de faucon ajoute une mécanique originale à maîtriser et partage son temps de recharge avec Tir des arcanes. Toutes les icônes et fiches de sorts renvoient vers \u003cb\u003eWoWhead Forever\u003c/b\u003e. Les images sont chargées depuis son CDN : une connexion internet est requise pour les afficher.\u003c/div\u003e\n\u003csection class=\"section\" id=\"rotation\"\u003e\u003cdiv class=\"sthead\"\u003e\u003cdiv\u003e\u003cdiv class=\"sect-kicker\"\u003e01 / OPTIMISATION PvE\u003c/div\u003e\u003ch2\u003eLa vraie rotation\u003c/h2\u003e\u003cp class=\"subtitle\"\u003eSource principale : Wowhead Forever. Reproduction reformulée en français, avec conditions d’utilisation.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"seg\" id=\"rotMode\"\u003e\u003cbutton class=\"sel\" data-value=\"beta\"\u003eNiveau 30 · Wowhead\u003c/button\u003e\u003cbutton data-value=\"sim\"\u003eNiveau 60 · Simulation\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"panel panelpad\"\u003e\u003cdiv class=\"gear-bar\"\u003e\u003cspan class=\"smallcaps\" id=\"rotationLevel\"\u003eBÊTA NIVEAU 30 — WOWHEAD\u003c/span\u003e\u003cdiv class=\"seg\" id=\"rotScenario\"\u003e\u003cbutton class=\"sel\" data-value=\"single\"\u003eMonocible / boss\u003c/button\u003e\u003cbutton data-value=\"multi\"\u003ePlusieurs ennemis\u003c/button\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"rotation-flex\"\u003e\u003cdiv class=\"rot-list\" id=\"rotationCards\"\u003e\u003c/div\u003e\u003cdiv class=\"panel rot-info\"\u003e\u003ch3\u003ePourquoi cet ordre ?\u003c/h3\u003e\u003cdiv class=\"steps\" id=\"rotationNotes\"\u003e\u003c/div\u003e\u003cdiv class=\"actionlinks\"\u003e\u003ca id=\"rotationSource\" href=\"https://www.wowhead.com/forever/guide/classes/hunter/beast-mastery/level-30-dps-overview\" target=\"_blank\" rel=\"noopener noreferrer\"\u003eVoir la rotation originale sur Wowhead ↗\u003c/a\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"strip\" style=\"margin-bottom:0\"\u003e\u003cstrong\u003eAttention :\u003c/strong\u003e \u003cp\u003e\u003cb\u003eRotation :\u003c/b\u003e ce sont des priorités, jamais six boutons à cliquer méc
